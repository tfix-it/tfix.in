name: grant-eligibility-proprietorship
expected_outcome: |
  A clear eligibility analysis: proprietorship is not eligible for DPIIT recognition, so SISFS is blocked until conversion to Pvt Ltd/LLP/partnership; SISFS needs DPIIT recognition and incorporation within 2 years; KSUM Idea Grant needs incorporation and KSUM Unique ID before disbursal; a step-by-step plan with sources and dates.
